name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json << 'CAPCONFIG'
          {
            "appId": "com.chem.ref",
            "appName": "ХимСправ",
            "webDir": "www",
            "bundledWebRuntime": false,
            "npmClient": "npm",
            "android": {
              "allowMixedContent": true,
              "buildOptions": {
                "keystorePath": null,
                "keystorePassword": null,
                "keystoreAlias": null,
                "keystoreAliasPassword": null
              }
            }
          }
          CAPCONFIG

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r css js icons www/ 2>/dev/null || true

      - name: Setup Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add"
          fi
          npx cap sync android
          
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission to Gradle
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Summary
        run: |
          echo "✅ APK готов!"
          echo "📦 Размер: $(ls -lh android/app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
          echo "🔗 Скачай в разделе 'Actions' → выбери запуск → 'Artifacts'"
